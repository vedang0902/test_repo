version: "3.9"

# PaymentPipeline — Local development stack
# Runs: FastAPI app, Prometheus, Alertmanager, Grafana
#
# Usage:
#   docker-compose up -d
#   App API:       http://localhost:5000
#   API Docs:      http://localhost:5000/docs
#   Prometheus:    http://localhost:9090
#   Alertmanager:  http://localhost:9093
#   Grafana:       http://localhost:3000 (admin/admin)

networks:
  paymentpipeline:
    driver: bridge

services:

  # ── FastAPI Payment Pipeline App ───────────────────────────────────────────
  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: paymentpipeline-app
    ports:
      - "5000:5000"     # API
      - "8000:8000"     # Prometheus metrics
    environment:
      - APP_ENV=production
      - LOG_LEVEL=DEBUG
      - DB_POOL_SIZE=5
      - DB_FAILURE_RATE=0.12
      - PARTIAL_COMMIT_RATE=0.07
      - GATEWAY_RETRY_RATE=0.20
      - RECON_INTERVAL=30
      - SQLITE_PATH=/data/paymentpipeline.db
      - METRICS_PORT=8000
      - API_PORT=5000
    volumes:
      - app-data:/data
    networks:
      - paymentpipeline
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Prometheus ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: paymentpipeline-prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus-data:/prometheus
    networks:
      - paymentpipeline
    restart: unless-stopped

  # ── Alertmanager ───────────────────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: paymentpipeline-alertmanager
    ports:
      - "9093:9093"
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--web.external-url=http://localhost:9093"
    volumes:
      - ../monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks:
      - paymentpipeline
    restart: unless-stopped

  # ── Grafana (optional, for dashboards) ────────────────────────────────────
  grafana:
    image: grafana/grafana:10.2.2
    container_name: paymentpipeline-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-clock-panel
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - paymentpipeline
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  app-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:
