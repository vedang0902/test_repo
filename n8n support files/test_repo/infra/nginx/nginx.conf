# Nginx reverse proxy for PaymentPipeline
# Sits in front of the FastAPI app in production

upstream paymentpipeline_app {
    server app:5000;
    keepalive 64;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=payment_api:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=webhook_api:10m rate=200r/s;

server {
    listen 80;
    server_name paymentpipeline.internal;

    # Security headers
    add_header X-Frame-Options          "DENY"              always;
    add_header X-Content-Type-Options   "nosniff"           always;
    add_header X-XSS-Protection         "1; mode=block"     always;
    add_header Strict-Transport-Security "max-age=31536000"  always;
    add_header Referrer-Policy          "strict-origin"     always;

    # Gzip
    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 256;

    # Payment API — rate limited
    location /payments {
        limit_req zone=payment_api burst=20 nodelay;
        proxy_pass         http://paymentpipeline_app;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Webhook endpoint — higher rate limit
    location /webhooks {
        limit_req zone=webhook_api burst=50 nodelay;
        proxy_pass         http://paymentpipeline_app;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 15s;
    }

    # Health check — no rate limit (used by LB)
    location /health {
        proxy_pass         http://paymentpipeline_app;
        proxy_http_version 1.1;
        access_log         off;
    }

    # Everything else
    location / {
        proxy_pass         http://paymentpipeline_app;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
