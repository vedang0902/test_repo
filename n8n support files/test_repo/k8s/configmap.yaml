apiVersion: v1
kind: ConfigMap
metadata:
  name: paymentpipeline-config
  namespace: payments
  labels:
    app: paymentpipeline
data:
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
  API_PORT: "5000"
  METRICS_PORT: "8000"

  # Database / pool config
  DB_POOL_SIZE: "5"
  DB_POOL_TIMEOUT: "3.0"
  DB_FAILURE_RATE: "0.12"
  DB_SLOW_QUERY_MS: "200"
  SQLITE_PATH: "/data/paymentpipeline.db"

  # Payment config
  PARTIAL_COMMIT_RATE: "0.07"
  FEE_RATE: "0.029"
  MAX_TX_AMOUNT: "50000.0"
  IDEMPOTENCY_TTL: "3600"

  # Fraud config
  FRAUD_THRESHOLD: "0.65"
  FRAUD_SCORE_BLEED: "0.30"
  FRAUD_HIGH_AMOUNT: "5000.0"
  FRAUD_CASCADE_COUNT: "4"

  # Webhook config
  WEBHOOK_STORM_THRESHOLD: "3"
  GATEWAY_RETRY_RATE: "0.20"
  WEBHOOK_MAX_RETRIES: "5"

  # Transaction generator
  GEN_MIN_INTERVAL: "2.0"
  GEN_MAX_INTERVAL: "6.0"
  GEN_BATCH_SIZE: "3"
  GEN_REFUND_RATE: "0.15"

  # Reconciliation
  RECON_INTERVAL: "30"
  RECON_DRIFT_THRESHOLD: "0.005"
