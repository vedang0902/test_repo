apiVersion: v1
kind: Service
metadata:
  name: paymentpipeline
  namespace: payments
  labels:
    app: paymentpipeline
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  selector:
    app: paymentpipeline
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 5000
    - name: metrics
      protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP

---
# Internal metrics service for Prometheus scraping
apiVersion: v1
kind: Service
metadata:
  name: paymentpipeline-metrics
  namespace: payments
  labels:
    app: paymentpipeline
    scrape: "true"
spec:
  selector:
    app: paymentpipeline
  ports:
    - name: metrics
      protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
