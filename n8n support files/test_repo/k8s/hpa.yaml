apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: paymentpipeline-hpa
  namespace: payments
  labels:
    app: paymentpipeline
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: paymentpipeline
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    - type: Pods
      pods:
        metric:
          name: payment_active_requests
        target:
          type: AverageValue
          averageValue: "20"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
