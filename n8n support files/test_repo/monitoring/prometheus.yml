global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    service: paymentpipeline
    environment: production

rule_files:
  - "alert.rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "host.docker.internal:9093"
      timeout: 10s

scrape_configs:
  # PaymentPipeline app metrics
  - job_name: "paymentpipeline"
    static_configs:
      - targets: ["host.docker.internal:8000"]
    metrics_path: /metrics
    scrape_interval: 5s
    scrape_timeout: 4s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "paymentpipeline-local"

  # Self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
